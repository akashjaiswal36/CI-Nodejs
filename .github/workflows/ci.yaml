name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'package.json'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Updated image tag')"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # <-- ensures full commit history

    # ===========================
    # Secret Scanning with GitLeaks
    # ============================
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        fail: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image to Docker hub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-akki:${{ github.sha }}

    # =========================
    # Security Scanning
    # =========================
    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.68.2_Linux-64bit.deb

        sudo dpkg -i trivy_0.68.2_Linux-64bit.deb

    # ===============================================
    # Scan image for HIGH / Critical velnerbilities
    # ===============================================
    - name: Trivy Image Scan (fail if  Critical)
      run: |
        trivy image --severity CRITICAL --exit-code 1 \
        ${{ secrets.DOCKERHUB_USERNAME }}/devops-akki:${{ github.sha }}

    # ====================
    # SBOM Generation
    # ====================

    # Generate SBOM (CycloneDX format)
    - name: Generate SBOM
      run: |
        trivy image --format cyclonedx --output sbom.json \
        ${{ secrets.DOCKERHUB_USERNAME }}/devops-akki:${{ github.sha }}

    # Upload SBOM as CI artifact
    - name: upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json

    # ===================================
    #  GITOPS UPDATE (ONLY IF ALL ABOVE PASSES)
    # ===================================

    - name: Update GitOps repo with new image tag
      run: |
        git config --global user.email "ci-bot@github.com"
        git config --global user.name "ci-bot"

        git clone https://x-access-token:${{ secrets.GITOPS_REPO_TOKEN }}@github.com/akashjaiswal36/CD-GitOps.git
     
        cd CD-GitOps/helm/devops-akki

        sed -i "s/tag:.*/tag: $GITHUB_SHA/" values.yaml

        git add values.yaml
        git commit -m "Updated image tag to $GITHUB_SHA"
        git push